name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make CFLAGS='-O2 -std=c11 -Wall -Wextra -Wpedantic -Werror'
      - run: make test
